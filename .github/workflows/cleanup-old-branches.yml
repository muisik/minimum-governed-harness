name: Clean obsolete development branches

on:
  push:
    branches:
      - feature/team-coordination

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete obsolete merged or superseded branches
        run: |
          set -eu
          git push origin --delete \
            agent/contextrail-1.1.0-close \
            agent/contextrail-1.1.0-delegation \
            agent/contextrail-1.2.0-update-awareness \
            agent/contextrail-1.3.0-reuse-first \
            agent/refresh-readme-1.3 \
            fix/contextrail-1.2.1-version-check \
            fix/release-version-sync \
            release/contextrail-v1.0.0
